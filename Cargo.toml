[package]
name = "chaincheck"
version = "0.1.3"
edition = "2024"
rust-version = "1.98"
description = "Read-only Linux/WSL scanner for retrospective local evidence of known malicious software supply-chain activity."
publish = false

[lib]
name = "chaincheck"
path = "src/lib.rs"

[[bin]]
name = "chaincheck"
path = "src/main.rs"

[dependencies]
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
jsonc-parser = { version = "0.33.1", default-features = false, features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.2.0", default-features = false, features = ["deserialize"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
